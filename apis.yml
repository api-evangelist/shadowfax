aid: shadowfax
name: Shadowfax AI
description: 'Shadowfax AI is an AI-native, agentic analytics platform founded in 2025 and based in Menlo
  Park, California, built by veterans of Snowflake, Palantir, Rubrik and Alteryx and backed by Khosla
  Ventures and the Snowflake Startup Accelerator. The product combines a spreadsheet, a BI tool, a visual
  pipeline and a code notebook into one analyst-in-the-loop workflow: users upload CSV, TSV, Excel or
  Parquet sources, which are held immutable, and every transformation produces a new View with full lineage,
  inspectable SQL and an auditable node graph. Features include AI Tables, an AI chat interface, schema
  discovery, slash commands, a reactive dependency system, manual SQL mode and a Vega-based visualization
  framework. It is in free public beta; live database connections to Snowflake and BigQuery are announced
  as coming soon. Shadowfax AI publishes no public developer API — the platform is an end-user product
  and its only HTTP contract sits behind a Clerk-authenticated session on app.shadowfax.ai.'
